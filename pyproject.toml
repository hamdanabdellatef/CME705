[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cme705-course"
version = "0.1.0"
description = "CME705 Machine Learning: Neural Networks, Deep Learning, and Research Practice"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2.0,<3.0",
  "torch>=2.5,<3.0",
  "torchvision>=0.20,<1.0",
  "transformers>=4.48,<5.0",
  "datasets>=3.2,<5.0",
  "pandas>=2.2,<3.0",
  "diffusers>=0.32,<0.36",
  "accelerate>=1.2,<2.0",
  "safetensors>=0.4,<1.0",
  "huggingface-hub>=0.34,<1.0",
  "torchmetrics>=1.6,<2.0",
  "torch-fidelity>=0.3,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
py-modules = []
